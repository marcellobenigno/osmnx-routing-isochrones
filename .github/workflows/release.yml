name: Release

# Push a tag such as 0.1.0 (same number as `version=` in metadata.txt) to:
#   1. build the plugin ZIP and attach it to a GitHub release;
#   2. upload it to plugins.qgis.org with the QGIS_TOKEN secret (plugin token from the plugin's
#      page on plugins.qgis.org) or, if that is missing or fails, with the OSGEO_USER /
#      OSGEO_PASSWORD secrets (Settings > Secrets and variables > Actions).
on:
  push:
    tags: ["*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04         # pinned: newer images may drop the Qt5 tools (lrelease)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q qttools5-dev-tools
          pip install qgis-plugin-ci
      - name: Check that the tag matches metadata.txt
        run: |
          grep -q "^version=${GITHUB_REF_NAME}$" osmnx_routing_isochrones/metadata.txt \
            || { echo "Tag ${GITHUB_REF_NAME} differs from version= in metadata.txt"; exit 1; }
      - name: Translations complete and compile
        run: python scripts/build_translations.py
      - name: Create the GitHub release (notes from CHANGELOG.md)
        # qgis-plugin-ci only uploads to an existing release; kept if it already exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          awk -v v="$GITHUB_REF_NAME" '$0 ~ "^## " v " " {f=1; next} /^## /{f=0} f' \
            CHANGELOG.md > notes.md
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
                 --notes-file notes.md
      - name: Release on GitHub (ZIP and plugins.xml)
        run: |
          qgis-plugin-ci release "${GITHUB_REF_NAME}" \
            --github-token ${{ secrets.GITHUB_TOKEN }} --create-plugin-repo
      - name: Publish on plugins.qgis.org (token first, then OSGeo user name and password)
        # qgis-plugin-ci refuses the token and the user name together, hence a separate step
        env:
          QGIS_TOKEN: ${{ secrets.QGIS_TOKEN }}
          OSGEO_USER: ${{ secrets.OSGEO_USER }}
          OSGEO_PASSWORD: ${{ secrets.OSGEO_PASSWORD }}
        run: python scripts/publish_plugin.py "osmnx_routing_isochrones.${GITHUB_REF_NAME}.zip"
