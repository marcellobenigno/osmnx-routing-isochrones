name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-core:
    runs-on: ubuntu-24.04         # pinned: newer images may drop the Qt5 tools (lrelease)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q qttools5-dev-tools
          pip install flake8 pytest osmnx
      - name: Lint
        run: flake8 --max-line-length 110 osmnx_routing_isochrones scripts tests
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"         # oldest Python shipped with QGIS 3.28
      - name: Syntax check on Python 3.9
        run: python -m compileall -q osmnx_routing_isochrones
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Translations complete and compile
        run: python scripts/build_translations.py
      - name: Core tests (no QGIS)
        run: pytest -v tests/test_core.py

  qgis:
    # Real QGIS, headless. 'latest' tracks the newest release (Qt6 / QGIS 4 when available)
    runs-on: ubuntu-24.04         # pinned: newer images may drop the Qt5 tools (lrelease)
    needs: lint-and-core
    strategy:
      fail-fast: false
      matrix:
        qgis: [release-3_34, ltr, latest]
    continue-on-error: ${{ matrix.qgis == 'latest' }}
    container:
      image: qgis/qgis:${{ matrix.qgis }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - name: Install osmnx next to QGIS's own packages
        run: |
          # some images (e.g. release-3_34, Ubuntu 22.04) ship Python without ensurepip
          if ! python3 -m venv --system-site-packages /opt/venv; then
            apt-get update -q && apt-get install -y -q python3-venv
            rm -rf /opt/venv && python3 -m venv --system-site-packages /opt/venv
          fi
          # keep numpy on the system's major version: QGIS's own scipy / GDAL bindings are
          # built against it (Ubuntu 22.04 has numpy 1.21, osmnx would pull numpy 2)
          NUMPY_MAJOR=$(python3 -c "import numpy; print(numpy.__version__.split('.')[0])")
          /opt/venv/bin/pip install -q osmnx pytest "numpy<$((NUMPY_MAJOR + 1))"
      - name: Check that the libraries import
        run: |
          /opt/venv/bin/python -c "import sys, numpy, geopandas, networkx, osmnx; \
            print(sys.version.split()[0], 'numpy', numpy.__version__, 'geopandas', \
                  geopandas.__version__, 'osmnx', osmnx.__version__)"
          /opt/venv/bin/python -c "from osmnx_routing_isochrones import core"
      - name: Algorithm tests in QGIS
        run: /opt/venv/bin/python -m pytest -v tests
